# CI on every pull request; on push to main, also build images, push them to
# GHCR, and have the Lightsail server pull and launch them.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   LIGHTSAIL_HOST     static IP or hostname of the instance
#   LIGHTSAIL_USER     SSH user (ubuntu on Lightsail's Ubuntu images)
#   LIGHTSAIL_SSH_KEY  private key for that user (the .pem from Lightsail)
# Server-side secrets live only in ~/pingmynest/.env (see deploy/README.md).
name: ci-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never interrupt a deploy halfway

env:
  REGISTRY: ghcr.io/oscusm

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet + test
        run: |
          test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend test + typecheck + lint + build
        working-directory: frontend
        env:
          NEXT_PUBLIC_PRODUCTION: "true"
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npx eslint .
          npx next build

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
            args: SERVICE=api
          - name: worker
            context: .
            file: Dockerfile
            args: SERVICE=worker
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            # /api is routed by Caddy in production; the Next rewrite target is a fallback
            args: |
              NEXT_PUBLIC_PRODUCTION=true
              API_UPSTREAM=http://api:8080
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/pingmynest-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/pingmynest-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy stack files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,migrations"
          target: "~/pingmynest"
          strip_components: 0
          overwrite: true

      - name: Pull and launch
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/pingmynest
            test -f .env || { echo "~/pingmynest/.env is missing (copy deploy/.env.example)"; exit 1; }
            mv -f deploy/docker-compose.prod.yml docker-compose.yml
            mv -f deploy/Caddyfile Caddyfile
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export TAG
            docker compose pull
            docker compose up -d postgres
            docker compose run --rm migrate
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://pingmynest.lol/api/health; then exit 0; fi
            sleep 5
          done
          echo "pingmynest.lol/api/health did not come up"; exit 1
